<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Word Guess</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial,sans-serif;user-select:none}
body{background:#121213;color:#fff;display:flex;flex-direction:column;align-items:center;padding:10px}
h1{margin:8px 0;font-size:26px;letter-spacing:2px}
#grid{display:grid;grid-template-rows:repeat(6,52px);gap:6px;margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(5,52px);gap:6px}
.cell{width:52px;height:52px;border:2px solid #3a3a3c;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;text-transform:uppercase;transition:background .2s}
.cell.ok{background:#538d4e;border-color:#538d4e}.cell.part{background:#b59f3b;border-color:#b59f3b}.cell.no{background:#3a3a3c;border-color:#3a3a3c}
#kb{display:flex;flex-direction:column;gap:6px}
.krow{display:flex;gap:5px;justify-content:center}
.key{background:#818384;color:#fff;border:0;border-radius:4px;height:52px;min-width:38px;padding:0 10px;font-size:15px;font-weight:bold;cursor:pointer;text-transform:lowercase}
.key.wide{min-width:62px}
.key.ok{background:#538d4e}.key.part{background:#b59f3b}.key.no{background:#3a3a3c}
#msg{min-height:24px;margin:10px 0;font-size:16px;color:#ffd93d}
button.again{display:none;background:#538d4e;border:0;border-radius:6px;color:#fff;padding:10px 18px;font-weight:bold;cursor:pointer;margin-bottom:10px}
</style>
</head>
<body>
<h1>WORD GUESS</h1>
<button class="again" onclick="reset()">Play Again</button>
<div id="grid"></div>
<div id="msg"></div>
<div id="kb"></div>
<script>
const WORDS='apple beach brain bread brick brush chair charm chest cloud dance dream drink eagle earth feast flame ghost giant grape green heart honey house juice knife lemon light mango money month night ocean party pizza plant queen river salad sheep shirt smile snake spice sport stone sugar table tiger toast train water whale world wrist zebra'.split(' ');
let target,row,col,done,gridEl=document.getElementById('grid'),msg=document.getElementById('msg'),again=document.querySelector('.again');
const rows=[];
function reset(){row=0;col=0;done=false;again.style.display='none';msg.textContent='';
 target=WORDS[Math.random()*WORDS.length|0];
 gridEl.innerHTML='';rows.length=0;
 for(let r=0;r<6;r++){const rd=document.createElement('div');rd.className='row';
  const cells=[];for(let c=0;c<5;c++){const d=document.createElement('div');d.className='cell';rd.appendChild(d);cells.push(d)}
  gridEl.appendChild(rd);rows.push(cells)}
 drawKB()}
function key(k){
 if(done)return;
 if(k==='Enter'){submit();return}
 if(k==='Backspace'){if(col>0){col--;rows[row][col].textContent=''}return}
 if(col<5&&/^[a-z]$/.test(k)){rows[row][col].textContent=k.toUpperCase();col++}}
function submit(){
 if(col<5){msg.textContent='Not enough letters';setTimeout(()=>msg.textContent='',1200);return}
 const guess=rows[row].map(c=>c.textContent.toLowerCase()).join('');
 const t=[...target],res=Array(5).fill('no');
 for(let i=0;i<5;i++)if(guess[i]===t[i]){res[i]='ok';t[i]=null}
 for(let i=0;i<5;i++)if(res[i]!=='ok'){const j=t.indexOf(guess[i]);if(j>=0){res[i]='part';t[j]=null}}
 const cells=rows[row];const keyEls={};
 document.querySelectorAll('.key').forEach(k=>keyEls[k.textContent.trim()]=k);
 for(let i=0;i<5;i++){cells[i].classList.add(res[i]);
  const ke=keyEls[guess[i]];
  if(ke&&(!ke.classList.contains('ok'))&&!(ke.classList.contains('part')&&res[i]==='no'))ke.classList.add(res[i])}
 if(guess===target){done=true;msg.textContent='🎉 Correct! The word was '+target.toUpperCase();again.style.display='block';return}
 row++;col=0;
 if(row===6){done=true;msg.textContent='Out of tries! The word was '+target.toUpperCase();again.style.display='block'}}
function drawKB(){
 const kb=document.getElementById('kb');kb.innerHTML='';
 const layout=['qwertyuiop','asdfghjkl','↵zxcvbnm⌫'];
 layout.forEach(r=>{const rd=document.createElement('div');rd.className='krow';
  [...r].forEach(ch=>{const b=document.createElement('button');b.className='key'+(ch==='↵'||ch==='⌫'?' wide':'');
   b.textContent=ch;
   b.onclick=()=>key(ch==='↵'?'Enter':ch==='⌫'?'Backspace':ch);rd.appendChild(b)});
  kb.appendChild(rd)})}
document.addEventListener('keydown',e=>key(e.key));
reset();
</script>
</body>
</html>
